<!DOCTYPE html>
<html>
<head>
  <title>Minecraft Seed Finder</title>
</head>

<body style="font-family: Arial; background:#111; color:white;">
  <h2>🌍 Minecraft Seed Finder (Feature Detector)</h2>

  <button onclick="startScan()">Start Scan</button>
  <p id="status"></p>
  <ul id="results"></ul>

<script>
function hash(seed) {
  let x = seed;
  x ^= x << 13;
  x ^= x >> 17;
  x ^= x << 5;
  return Math.abs(x);
}

function evaluateSeed(seed) {
  let h = hash(seed);

  let features = [];
  let score = 0;

  if ((h % 97) < 5) {
    features.push("🏡 Village nearby");
    score += 60;
  }

  if ((h % 89) < 20) {
    features.push("🌳 Flat plains area");
    score += 30;
  }

  if ((h % 131) < 8) {
    features.push("❄️ Rare biome chance");
    score += 50;
  }

  if ((h % 211) < 3) {
    features.push("⛏️ Stronghold-like structure");
    score += 70;
  }

  return { score, features };
}

function startScan() {
  const list = document.getElementById("results");
  const status = document.getElementById("status");

  list.innerHTML = "";

  let seed = 0;

  function loop() {
    for (let i = 0; i < 3000; i++) {
      seed++;

      let result = evaluateSeed(seed);

      if (result.score >= 100) {
        let li = document.createElement("li");

        li.innerHTML =
          "Seed: " + seed +
          " | Score: " + result.score +
          "<br>Found: " + result.features.join(", ");

        list.appendChild(li);
      }
    }

    status.textContent = "Scanning seed: " + seed;

    if (seed < 300000) {
      requestAnimationFrame(loop);
    } else {
      status.textContent += " | DONE";
    }
  }

  loop();
}
</script>

</body>
</html>
