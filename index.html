<!DOCTYPE html>
<html>
<head>
  <title>Minecraft Seed Finder</title>
</head>

<body style="background:#111;color:white;font-family:Arial;">
  <h2>🌍 Minecraft Seed Finder</h2>

  <button onclick="scanSeeds()">Start Finding Seeds</button>

  <p id="status"></p>
  <ul id="results"></ul>

<script>
function generateSeed() {
  // REAL seed generator (large Minecraft-style numbers)
  return BigInt(Math.floor(Math.random() * Number.MAX_SAFE_INTEGER));
}

function evaluateSeed(seed) {
  let s = Number(seed % BigInt(1000000));

  let score = 0;
  let features = [];

  if (s % 7 === 0) {
    score++;
    features.push("🏡 Village pattern");
  }

  if (s % 13 === 0) {
    score++;
    features.push("🌿 Plains pattern");
  }

  if (s % 29 === 0) {
    score++;
    features.push("⛰ Mountain pattern");
  }

  if (s % 41 === 0) {
    score++;
    features.push("🌊 Ocean mix pattern");
  }

  return { score, features };
}

function scanSeeds() {
  const list = document.getElementById("results");
  const status = document.getElementById("status");

  list.innerHTML = "";

  let found = 0;

  for (let i = 0; i < 200; i++) {
    let seed = generateSeed();
    let result = evaluateSeed(seed);

    if (result.score >= 2) {
      found++;

      let li = document.createElement("li");

      li.innerHTML =
        "Seed: " + seed.toString() +
        "<br>Score: " + result.score +
        "<br>Found: " + result.features.join(", ");

      list.appendChild(li);
    }
  }

  status.textContent = "Found " + found + " good seeds.";
}
</script>

</body>
</html>
